<svg xmlns="[suspicious link removed]" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Dark Radial Background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="60%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#020308"/>
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowMagenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Sparkline Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="50%" stop-color="#FF0080"/>
      <stop offset="100%" stop-color="#00DFD8"/>
    </linearGradient>

    <!-- Hex Grid Background Pattern -->
    <pattern id="hexGrid" width="40" height="69.282" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 20 11.547 L 0 0 L 0 23.094 L 20 34.641 L 40 23.094 Z M 0 34.641 L 20 46.188 L 0 57.735 L 0 80.829 L 20 92.376 L 40 80.829 Z" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Outer Card Frame -->
  <rect width="800" height="800" rx="40" fill="url(#bgGrad)"/>
  <rect width="800" height="800" rx="40" fill="url(#hexGrid)" opacity="0.7"/>

  <!-- Corner HUD Brackets -->
  <g stroke="#00FFCC" stroke-width="3" fill="none" opacity="0.8">
    <path d="M 50 90 L 50 50 L 90 50" />
    <path d="M 710 50 L 750 50 L 750 90" />
    <path d="M 50 710 L 50 750 L 90 750" />
    <path d="M 710 750 L 750 750 L 750 710" />
  </g>

  <!-- Grid Lines -->
  <g stroke="#1E293B" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.6">
    <line x1="80" y1="200" x2="720" y2="200"/>
    <line x1="80" y1="320" x2="720" y2="320"/>
    <line x1="80" y1="440" x2="720" y2="440"/>
    <line x1="80" y1="560" x2="720" y2="560"/>
  </g>

  <!-- Concentric Telemetry Core -->
  <g transform="translate(400, 380)">
    <circle cx="0" cy="0" r="220" fill="none" stroke="#0077FF" stroke-width="1.5" stroke-dasharray="12 12" opacity="0.4"/>
    <circle cx="0" cy="0" r="170" fill="none" stroke="#00FFCC" stroke-width="1" stroke-dasharray="4 8" opacity="0.5"/>

    <polygon points="0,-140 121.24,-70 121.24,70 0,140 -121.24,70 -121.24,-70" fill="none" stroke="#00FFCC" stroke-width="4" filter="url(#glowCyan)"/>
    <polygon points="0,-110 95.26,-55 95.26,55 0,110 -95.26,55 -95.26,-55" fill="#0A1128" stroke="#0077FF" stroke-width="3" opacity="0.95"/>
    <polygon points="0,-75 64.95,-37.5 64.95,37.5 0,75 -64.95,37.5 -64.95,-37.5" fill="#030712" stroke="#00FFCC" stroke-width="2"/>

    <circle cx="0" cy="0" r="32" fill="#00FFCC" filter="url(#glowCyan)"/>
    <circle cx="0" cy="0" r="16" fill="#FFFFFF"/>
  </g>

  <!-- Glowing Trend Line & Nodes -->
  <g filter="url(#glowMagenta)">
    <polyline points="100,540 220,460 310,500 450,300 580,360 700,210" fill="none" stroke="url(#lineGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="100" cy="540" r="6" fill="#7928CA"/>
    <circle cx="220" cy="460" r="6" fill="#A811DA"/>
    <circle cx="310" cy="500" r="6" fill="#D200B2"/>
    <circle cx="450" cy="300" r="7" fill="#FF0080"/>
    <circle cx="580" cy="360" r="6" fill="#806FE2"/>
    <circle cx="700" cy="210" r="10" fill="#00DFD8"/>
  </g>

  <!-- Telemetry Readouts -->
  <text x="90" y="82" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#00FFCC" letter-spacing="2">SYS_ID // 0x9F4B-AXE</text>
  <text x="710" y="82" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#0077FF" text-anchor="end" letter-spacing="2">LATENCY: 0.24ms [ONLINE]</text>

  <text x="90" y="730" font-family="'Courier New', monospace" font-size="12" fill="#64748B" letter-spacing="1">FABRIC_STATUS: ACTIVE</text>
  <text x="710" y="730" font-family="'Courier New', monospace" font-size="12" fill="#64748B" text-anchor="end" letter-spacing="1">NODES: 1024 / 1024</text>

  <!-- Main Headers -->
  <text x="400" y="650" font-family="'Courier New', monospace" font-weight="900" font-size="44" fill="#F8FAFC" text-anchor="middle" letter-spacing="8" filter="url(#glowCyan)">AXESCOUT</text>
  <text x="400" y="688" font-family="'Courier New', monospace" font-size="20" font-weight="700" fill="#00FFCC" text-anchor="middle" letter-spacing="4">ROOTBASE FABRIC</text>
</svg>
